<div class="login-page">
  <section class="login-brand">
    <a class="brand">
      <img class="logo" src="img/hacha.png" alt="Hacha Esports" />
      <span>HACHA<span class="hq">HQ</span><small>ESPORTS WORKSPACE</small></span>
    </a>
    >
    <div>
      <p class="eyebrow">UN EQUIPO. UN MISMO OBJETIVO.</p>
      <h1>El próximo nivel<br />empieza acá.</h1>
      <p>
        Tu equipo, tus objetivos y cada próxima partida.<br />Todo en un mismo
        lugar.
      </p>
    </div>
    <span class="muted">HACHA HQ · TEMPORADA 2026</span>
  </section>
  <section class="login-form">
    <p class="eyebrow">BIENVENIDO AL EQUIPO</p>
    <h1>Iniciar sesión</h1>
    <p class="muted">Ingresá a tu espacio de trabajo.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label
        >Correo electrónico<input
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="admin@hacha.gg" /></label
      ><label
        >Contraseña
        <div class="password-field">
          <input
            [type]="show() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          /><button
            type="button"
            (click)="show.set(!show())"
            [attr.aria-label]="
              show() ? 'Ocultar contraseña' : 'Mostrar contraseña'
            "
          >
            {{ show() ? "Ocultar" : "Mostrar" }}
          </button>
        </div></label
      >
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button class="primary" type="submit">Entrar al workspace ↗</button>
    </form>
  </section>
</div>
